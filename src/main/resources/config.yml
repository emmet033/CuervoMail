# Configuración de CuervoMail

# Cooldown general entre envíos (en segundos) por jugador
cooldown-segundos: 30

# Velocidad del cuervo: Bloques que recorre por segundo
# (Ejemplo: a 5.0 bloques/seg, 100 bloques de distancia tardan 20 segundos)
bloques-por-segundo: 5.0

# Tiempo fijo (en segundos) si los jugadores están en mundos distintos (ej. Overworld y Nether)
tiempo-entre-mundos-segundos: 20

# Sonido de Minecraft que sonará al recibir la carta
sonido-entrega: "ENTITY_PARROT_AMBIENT"
sonido-volumen: 1.0
sonido-tono: 1.0

# Configuración del envío individual normal (/cuervo enviar)
envio-individual:
  item-requerido: "PAPER"
  cantidad: 1

# Configuración para el envío masivo de jugadores (/cuervomasivo)
envio-masivo:
  cooldown-segundos: 120
  item-requerido: "PAPER"
  escalas:
    rango-1:
      min-jugadores: 1
      max-jugadores: 5
      cantidad-requerida: 3
    rango-2:
      min-jugadores: 6
      max-jugadores: 10
      cantidad-requerida: 7
    rango-3:
      min-jugadores: 11
      max-jugadores: 999
      cantidad-requerida: 17
